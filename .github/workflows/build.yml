# Builds tagged release artifacts for packaged OpenWand distributions.
name: Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows_only:
        description: Test only the signed Windows installer on a development branch
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  prepare-release:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Verify tag matches pyproject version
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_tag="v${project_version}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error title=Release tag mismatch::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$project_version'; expected '$expected_tag'."
            exit 1
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ ! -s "$notes_file" ]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Refusing to overwrite a published release."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --title "OpenWand $GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "OpenWand $GITHUB_REF_NAME" --notes-file "$notes_file"
          fi

  build-windows:
    name: Windows build
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest
    environment: Release Signing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-windows.lock
            requirements/requirements-build.lock

      - name: Build Windows test artifact
        env:
          OPENWAND_BUILD_JOURNEYS: "1"
        shell: pwsh
        run: .\tools\build_exe.ps1 -Clean -Yes

      - name: Smoke-test packaged Windows test runtime
        shell: pwsh
        run: .\.venv-build\Scripts\python.exe scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Exercise user journeys in the packaged Windows app
        run: .\.venv-build\Scripts\python.exe -m scripts.user_journeys --packaged --output reports/packaged-user-journeys --timeout 480

      - name: Check released 0.12.x updater compatibility
        run: .\.venv-build\Scripts\python.exe -m scripts.check_legacy_updater_compatibility --fetch --report reports/legacy-updater-compatibility.json

      - name: Build Windows artifact
        shell: pwsh
        run: .\tools\build_exe.ps1 -Clean -Yes

      - name: Smoke-test packaged Windows runtime
        run: .\.venv-build\Scripts\python.exe scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Upload packaged Windows user journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-user-journeys-windows
          path: |
            reports/packaged-user-journeys/report.md
            reports/packaged-user-journeys/coverage-checklist.md
            reports/packaged-user-journeys/*-results.json
            reports/packaged-user-journeys/*-ready.json
            reports/packaged-user-journeys/*-process.log
            reports/packaged-user-journeys/provider-requests.json
            reports/packaged-user-journeys/browser-events.json
            reports/packaged-user-journeys/runtime.json
            reports/packaged-user-journeys/runner-error.txt
            reports/packaged-user-journeys/incomplete-execution.txt
            reports/packaged-user-journeys/screenshots/
            reports/legacy-updater-compatibility.json
          if-no-files-found: warn

      - name: Ensure PowerShell Gallery is available
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inventory Windows bundle signatures
        id: windows-signatures
        shell: pwsh
        run: >-
          ./tools/check_windows_signatures.ps1 -BundlePath dist/OpenWand
          -Mode Prepare -CatalogPath dist/windows-signing-catalog.txt

      - name: Sign unsigned Windows bundle code
        if: steps.windows-signatures.outputs.unsigned-count != '0'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\dist\windows-signing-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenWand
          description-url: https://github.com/SunnyLich/OpenWand

      - name: Verify Windows bundle signatures
        shell: pwsh
        run: >-
          ./tools/check_windows_signatures.ps1 -BundlePath dist/OpenWand
          -Mode Verify -ReportPath dist/windows-signatures.csv

      - name: Prepare Inno installer and uninstaller for signing
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -Phase Prepare

      - name: Verify installer maintenance and downgrade notices
        shell: pwsh
        run: ./tools/test_installer_maintenance.ps1 -CompilerPath (Join-Path $env:RUNNER_TEMP 'OpenWand-Inno-6.7.3\ISCC.exe')

      - name: Upload installer maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-maintenance-windows
          path: |
            .tmp/installer-maintenance-*/result.json
            .tmp/installer-maintenance-*/*.log
          include-hidden-files: true
          if-no-files-found: warn

      - name: Sign Windows uninstaller
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\installer-signing\openwand-uninstaller.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenWand Uninstaller
          description-url: https://github.com/SunnyLich/OpenWand

      - name: Compile installer with signed uninstaller
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -Phase Complete

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.OPENWAND_INSTALLER_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenWand Installer
          description-url: https://github.com/SunnyLich/OpenWand

      - name: Smoke-test signed installer and Windows uninstall
        shell: pwsh
        run: ./tools/test_openwand_installer.ps1 -InstallerPath $env:OPENWAND_INSTALLER_PATH

      - name: Smoke-test portable migration into signed installer
        shell: pwsh
        run: ./tools/test_portable_to_installer.ps1 -InstallerPath $env:OPENWAND_INSTALLER_PATH

      - name: Verify upgrade from released 0.12.2 preserves data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PreviousDir = Join-Path $env:RUNNER_TEMP 'OpenWandPreviousRelease'
          gh release download v0.12.2 --repo $env:GITHUB_REPOSITORY --pattern 'OpenWand-v0.12.2-windows-x64-setup.exe' --dir $PreviousDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the released 0.12.2 installer.' }
          ./tools/test_openwand_installer.ps1 -InstallerPath $env:OPENWAND_INSTALLER_PATH -PreviousInstallerPath (Join-Path $PreviousDir 'OpenWand-v0.12.2-windows-x64-setup.exe')

      - name: Smoke-test Windows ZIP bridge and failure log
        shell: pwsh
        run: ./tools/test_windows_zip_apply.ps1

      - name: Smoke-test one-click ZIP to installer handoff
        shell: pwsh
        run: ./tools/test_zip_auto_installer.ps1

      - name: Package Windows artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath packaging\windows\transition-asset.json)) {
            $safeRef = $env:GITHUB_REF_NAME -replace '[\\/]', '-'
            Compress-Archive -Path dist\OpenWand -DestinationPath "dist\OpenWand-$safeRef-windows-x64.zip" -Force
          }

      - name: Prepare Microsoft Store submission files
        run: .\.venv-build\Scripts\python.exe scripts/prepare_store_submission.py --installer $env:OPENWAND_INSTALLER_PATH

      - name: Upload Microsoft Store submission files for review
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-submission
          path: reports/store-submission/
          if-no-files-found: error

      - name: Upload Windows release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:GITHUB_REF_NAME $env:OPENWAND_INSTALLER_PATH
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the immutable Windows installer.' }
          $archive = Get-Item dist\OpenWand-*-windows-x64.zip -ErrorAction SilentlyContinue
          if ($archive) {
            gh release upload $env:GITHUB_REF_NAME $archive.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the transition ZIP.' }
          }

      - name: Upload Windows artifact for manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: openwand-windows
          path: |
            dist/OpenWand-*-windows-x64.zip
            dist/installer/*-windows-x64-setup.exe
          if-no-files-found: error
          # Manual debug builds still use Actions artifact storage; release builds
          # publish directly to GitHub Releases to avoid Actions storage quota.
          retention-days: 1
          compression-level: 9

  build-linux:
    name: Linux build
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && !inputs.windows_only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-linux.lock
            requirements/requirements-build.lock

      - name: Install Linux system dependencies
        run: |
          # GitHub-hosted Ubuntu images may include Microsoft apt sources we do
          # not use; transient 403s there can break apt-get update.
          sudo rm -f \
            /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/azure-cli.sources \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/microsoft-prod.sources \
            /etc/apt/sources.list.d/packages-microsoft-prod.list \
            /etc/apt/sources.list.d/packages-microsoft-prod.sources
          sudo apt-get update
          sudo apt-get install -y libegl1 libportaudio2 libsndfile1

      - name: Make build script executable
        run: chmod +x ./tools/build_exe.sh

      - name: Build Linux test artifact
        env:
          OPENWAND_BUILD_JOURNEYS: "1"
        run: ./tools/build_exe.sh --clean --yes

      - name: Smoke-test packaged Linux test runtime
        run: ./.venv-build/bin/python scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Exercise user journeys in the packaged Linux app
        run: ./.venv-build/bin/python -m scripts.user_journeys --packaged --output reports/packaged-user-journeys --timeout 480

      - name: Build Linux artifact
        run: ./tools/build_exe.sh --clean --yes

      - name: Smoke-test packaged Linux runtime
        run: ./.venv-build/bin/python scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Upload packaged Linux user journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-user-journeys-linux
          path: |
            reports/packaged-user-journeys/report.md
            reports/packaged-user-journeys/coverage-checklist.md
            reports/packaged-user-journeys/*-results.json
            reports/packaged-user-journeys/*-ready.json
            reports/packaged-user-journeys/*-process.log
            reports/packaged-user-journeys/provider-requests.json
            reports/packaged-user-journeys/browser-events.json
            reports/packaged-user-journeys/runtime.json
            reports/packaged-user-journeys/runner-error.txt
            reports/packaged-user-journeys/incomplete-execution.txt
            reports/packaged-user-journeys/screenshots/
          if-no-files-found: warn

      - name: Package Linux artifact
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          tar -czf "dist/OpenWand-${safe_ref}-linux-x64.tar.gz" -C dist OpenWand

      - name: Upload Linux release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/OpenWand-*-linux-x64.tar.gz --clobber

      - name: Upload Linux artifact for manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: openwand-linux
          path: dist/OpenWand-*-linux-x64.tar.gz
          if-no-files-found: error
          # See the Windows job: keep manual debug artifacts short-lived.
          retention-days: 1
          compression-level: 9

  build-macos:
    name: macOS build
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && !inputs.windows_only
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements/requirements-macos.lock
            requirements/requirements-build.lock

      - name: Make build script executable
        run: chmod +x ./tools/build_macos_app.sh

      - name: Build macOS test artifact
        env:
          OPENWAND_BUILD_JOURNEYS: "1"
        run: ./tools/build_macos_app.sh --clean --yes

      - name: Smoke-test packaged macOS test runtime
        run: ./.venv-build/bin/python scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Exercise user journeys in the packaged macOS app
        run: ./.venv-build/bin/python -m scripts.user_journeys --packaged --output reports/packaged-user-journeys --timeout 480

      - name: Build macOS artifact
        run: ./tools/build_macos_app.sh --clean --yes

      - name: Smoke-test packaged macOS runtime
        run: ./.venv-build/bin/python scripts/run_launcher_smoke.py --kind packaged --timeout 240

      - name: Upload packaged macOS user journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-user-journeys-macos
          path: |
            reports/packaged-user-journeys/report.md
            reports/packaged-user-journeys/coverage-checklist.md
            reports/packaged-user-journeys/*-results.json
            reports/packaged-user-journeys/*-ready.json
            reports/packaged-user-journeys/*-process.log
            reports/packaged-user-journeys/provider-requests.json
            reports/packaged-user-journeys/browser-events.json
            reports/packaged-user-journeys/runtime.json
            reports/packaged-user-journeys/runner-error.txt
            reports/packaged-user-journeys/incomplete-execution.txt
            reports/packaged-user-journeys/screenshots/
          if-no-files-found: warn

      - name: Package macOS artifact
        run: |
          arch="$(uname -m)"
          if [ "$arch" = "x86_64" ]; then arch="x64"; fi
          safe_ref="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --keepParent dist/OpenWand.app "dist/OpenWand-${safe_ref}-macos-${arch}.zip"

      - name: Upload macOS release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/OpenWand-*-macos-*.zip --clobber

      - name: Upload macOS artifact for manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: openwand-macos
          path: dist/OpenWand-*-macos-*.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  publish-release:
    name: Publish release manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --dir release-assets \
            --pattern "OpenWand-${GITHUB_REF_NAME}-*"

      - name: Generate update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' -t release_files < <(
            find release-assets -type f ! -name "openwand-release-manifest.json" -print0
          )
          legacy_arg=()
          if [ -f packaging/windows/transition-asset.json ]; then
            legacy_tag="$(python -c 'import json; from pathlib import Path; u=json.loads(Path("packaging/windows/transition-asset.json").read_text())["url"]; print(u.split("/releases/download/",1)[1].split("/",1)[0])')"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$legacy_tag" > "$RUNNER_TEMP/openwand-transition-release.json"
            legacy_arg=(--legacy-windows-asset packaging/windows/transition-asset.json --legacy-release-metadata "$RUNNER_TEMP/openwand-transition-release.json")
          fi
          python scripts/make_release_manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --out release-assets/openwand-release-manifest.json \
            --checksums-out release-assets/SHA256SUMS.txt \
            "${legacy_arg[@]}" \
            "${release_files[@]}"

      - name: Upload release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/openwand-release-manifest.json release-assets/SHA256SUMS.txt --clobber
