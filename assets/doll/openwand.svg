     ry="426.20438" />
  <circle
     cx="640"
     cy="640"
     fill="none"
     stroke="#ff9d00"
     stroke-width="10.5093"
     id="circle4"
     r="404.74536" />
  <!-- Closed leaf terminals mask the ring beneath them. -->
  <path
     d="m 640,82.353955 c -61.99396,50.416935 -75.65363,116.267635 0,181.089455 75.65363,-64.82182 61.99396,-130.67252 0,-181.089455 z"
     fill="#000000"
     stroke="#ff9d00"
     stroke-width="14.5141"
     stroke-linejoin="miter"
