       id="use6" />
    <use
       href="#brown-petal"
       transform="rotate(90,640,620)"
       id="use7" />
    <use
       href="#brown-petal"
       transform="rotate(180,640,620)"
       id="use8" />
    <use
       href="#brown-petal"
       transform="rotate(-90,640,620)"
       id="use9" />
  </g>
  <!-- Four identical diagonal orange panes. -->
  <g
     fill="#ff9d00"
     stroke="#000000"
     stroke-width="13"
     stroke-linejoin="miter"
     id="g13"
     transform="matrix(1.0526317,0,0,1.0526315,-33.684295,-12.631585)">
