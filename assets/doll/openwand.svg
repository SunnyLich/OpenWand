  <title
     id="title">OpenWand circuit flower icon</title>
  <desc
     id="desc">A symmetrical black, orange, brown, and graphite app icon with concentric rings and a centered upright magic wand.</desc>
  <defs
     id="defs1">
    <path
       id="brown-petal"
       d="M500 385 A300 300 0 0 1 780 385 L704 478 A164 164 0 0 0 576 478 Z" />
    <path
       id="orange-petal"
       d="M700 474 L770 376 H890 V484 L797 548 L758 512 Z" />
  </defs>
  <!-- Palette: orange #FF9D00, brown #4A4035, graphite #343941, black #000000. -->
  <rect
     x="12.215886"
     y="12.215892"
     width="1255.5682"
     height="1255.5682"
     rx="141.92479"
     fill="#000000"
     stroke="#ff9d00"
     stroke-width="24.4317"
     id="rect2" />
  <!-- Outer orbital framework. -->
  <ellipse
     cx="640"
     cy="640"
     fill="none"
     stroke="#ff9d00"
     stroke-width="11.5674"
     id="circle2"
     rx="544.21625"
     ry="544.21631" />
  <ellipse
     cx="640"
     cy="640"
     fill="none"
