     cy="640"
     fill="none"
     stroke="#ff9d00"
     stroke-width="11.563"
     id="circle6"
     rx="332.31909"
     ry="333.98618" />
  <!-- Four identical cardinal brown panes. -->
  <g
     fill="#4a4035"
     stroke="#000000"
     stroke-width="13"
     stroke-linejoin="miter"
     id="g9"
     transform="matrix(1.050089,0,0,1.0500874,-32.056994,-11.054184)">
    <use
