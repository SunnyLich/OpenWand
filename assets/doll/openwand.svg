     cy="640"
     fill="#000000"
     id="circle15"
     rx="122"
     ry="122.5"
     style="stroke-width:1.05387" />
  <!-- Both star layers are geometrically centered on the circles at (640, 620). -->
  <path
     d="M 640,420.78499 688.28581,585.19624 845.21467,640 688.28581,694.80376 640,859.21502 591.71419,694.80376 434.78533,640 591.71419,585.19624 Z"
