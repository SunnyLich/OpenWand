label = "Clean up this export"
hint = "Preview exact cell fixes, then apply only the changes you approve"
prompt = "Inspect the selected export for cleanup problems and propose only concrete, unambiguous cell replacements. Preserve formulas and valid distinctions, leave ambiguous cases unchanged, and use the reviewed cleanup tool for no more than 32 exact cells. Nothing may change before the preview is approved."
capability = "calc.clean_range@1"
planner = "calc_plan_clean_range"
access = ["files"]
